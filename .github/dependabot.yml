version: 2

# Version updates, once a week. Security advisories do not wait for them: Dependabot alerts and security updates are settings of the
# repository (Settings > Advanced Security), and the waiting time below does not apply to a security update.
#
# `cooldown`: a version is proposed only once it has been out for some days. A release that is withdrawn or found compromised in its
# first days never reaches a pull request here.
updates:
  # Electron is not proposed here, see `ignore` below: it is how Chromium gets updated, and it moves by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    ignore:
      # Electron comes through `pnpm electron:upgrade` (docs/mise-a-jour-chromium.md), never through a pull request of Dependabot: the
      # downloads are built with the Electron of castLabs (the Widevine variant, `+wvcus` builds), and scripts/ecs-checksums.json has no
      # entry for a build that nobody has prepared by hand, so every such pull request fails its checks.
      - dependency-name: electron
    groups:
      # The two packages that carry the extensions. electron-chrome-extensions is patched (patches/): a new version needs its patch
      # written again, so it never hides in a larger group.
      extensions:
        patterns: [electron-chrome-extensions, electron-chrome-web-store]
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      build-tools:
        patterns: [vite, electron-vite, '@vitejs/*', typescript, electron-builder, '@types/node']
      # The coverage provider (@vitest/coverage-v8) must stay at the version of vitest: a test checks it, so the two move in one pull request.
      test-tools:
        patterns: [vitest, '@vitest/*', '@playwright/test']
      # The linter and the package that reads the types for it: they move together (oxlint names the oldest oxlint-tsgolint it accepts).
      lint-tools:
        patterns: [oxlint, oxlint-tsgolint]
      # What is left (the blocker, the reader, koffi, the domain list) runs in the browser: one pull request each, read one by one.

  # The workflows pin every action to a commit; this keeps the pins and the version comments current. The image of the secret scanner
  # (secret-scanning.yml) is pinned by digest in the workflow itself: Dependabot does not move it, a test fails until it follows the action.
  # `/` reads the workflows; a local action is read only when its own folder is named, so the pin of pnpm/setup in .github/actions/setup is
  # followed through the second line (a new folder under .github/actions is added here).
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
