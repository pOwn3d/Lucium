name: E2E

# The end-to-end suite of tests/e2e (Playwright driving the real application, the same run as `pnpm test:e2e`) on macOS.
# MANUAL (Actions tab > E2E > Run workflow) or NIGHTLY, never on a push or a pull request: a run takes a macOS runner for some fifteen
# minutes (13 to 20 measured), and on a private repository GitHub bills macOS minutes at 10 times the Linux rate (see ci.yml). Run it by
# hand before a release and after an Electron bump, on the commit concerned.
#
# The tests need no secret and no outside network: each one starts the built application with a data folder of its own, and the pages
# come from a local server (tests/e2e/launch.ts, helpers.ts). The launcher makes it so, it is not only said: Chromium resolves the names
# of the tests and this machine and no other (`HOST_RULES`), and the blocker downloads no list (`LUCIUM_E2E=1`). tests/e2e/smoke.spec.ts
# checks both at each run. Playwright drives Electron's own binary: no browser to download.
#
# The visual comparison of the Settings (tests/e2e/settings.spec.ts) compares with the pictures this runner drew, kept in Git
# (tests/e2e/settings.spec.ts-snapshots/*-darwin-ci.png): the pixels depend on the screen, the fonts and the version of macOS, so the
# machine that compares is the one that drew. The nightly run draws nothing: a missing reference fails it (playwright.config.ts).
# To draw the references again (a change of the Settings that is wanted, a new runner image): run the workflow by hand with "Draw the
# reference pictures". That run only draws, it compares nothing; the pictures are in its artefact "e2e-results", to be looked at one by
# one and committed.
#
# On a runner (`CI` is set) a `test.only` left in a file fails the run (`forbidOnly`), and the failures are written on the run's page
# and in test-results/junit.xml.
#
# Security: no `pull_request_target`, a read-only token, nothing written back to the repository.

on:
  workflow_dispatch:
    inputs:
      draw_references:
        description: 'Draw the reference pictures of the Settings instead of running the suite (kept in the artefact, to look at and commit)'
        type: boolean
        default: false
  schedule:
    # Every night, 02:30 UTC.
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The setup of ci.yml (see the comment there).
      - uses: ./.github/actions/setup
      - name: Machine
        run: uname -m && sw_vers
      # A safety net when the install script of the electron package did not fetch its binary (allowBuilds in pnpm-workspace.yaml).
      - run: node node_modules/electron/install.js
      - name: Build
        run: pnpm build
      # `pnpm test:e2e` is `electron-vite build && playwright test`: the build is the step above. No `--update-snapshots` here: the visual
      # test compares with the pictures kept in Git, and fails when one is missing.
      - name: Playwright
        if: ${{ !inputs.draw_references }}
        run: pnpm exec playwright test
      # By hand only: the visual test alone, drawing every reference again. The input is read as a condition, never written in a command.
      - name: Draw the reference pictures of the Settings
        if: ${{ inputs.draw_references }}
        run: pnpm exec playwright test tests/e2e/settings.spec.ts --update-snapshots=all
      # The traces of the failed tests (test-results/, trace: retain-on-failure in playwright.config.ts), the report (junit.xml) and the
      # pictures of the Settings: the references, and for a failed comparison what was drawn and where it differs (in test-results/).
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results/
            tests/e2e/settings.spec.ts-snapshots/
          if-no-files-found: ignore
          retention-days: 7
