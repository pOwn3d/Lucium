name: Secret Scanning

# Scan for hardcoded secrets and credentials on every push and PR to main branch.
# Uses TruffleHog (open-source secrets scanner) for detection.
#
# The range scanned is what the event brings: on a push, from the commit main was at before the push (`event.before`) to HEAD; on a
# pull request, from its base to HEAD. A base equal to HEAD (the default branch, on a push to main) would scan nothing. Three cases have no
# usable "before", and the WHOLE history is scanned then: a push that creates the branch (all zeros), a forced push (the commit main was
# at is not in the history any more; scanning since it would fail with no secret found), and the weekly or manual run, which is there
# so that the whole history is read again with the detectors of the day whatever the pushes were.
#
# Two passes over the same range. The first (job `secrets`) keeps `--only-verified`: TruffleHog checks each candidate against the service it
# belongs to, and only a secret that still works fails the build. That is what makes it quiet, and it is also why a key with no service to ask
# (an Apple `.p8`, a `.p12`, an SSH private key) passes it. The second pass (job `unverified`) reports everything TruffleHog finds, verified or
# not, and never fails on it: it has no `--fail`, the findings go to the artifact `trufflehog-unverified` of the run, to be read, and a warning
# on the run says how many there are. The secrets themselves (`Raw`, `RawV2`) are removed from that file before it is uploaded: the artifact of a
# public repository can be downloaded by any signed-in GitHub user.
#
# One scanner for the two passes: the image of the release the action is pinned to, by its digest. Left alone, the action of the first pass
# would run the image tagged `latest`, whatever the commit it is pinned to. Dependabot moves the pin of the action and not the image: a
# test (src/main/workflow-files.test.ts) fails until the version and the digest follow. The digest of a release:
#   docker buildx imagetools inspect ghcr.io/trufflesecurity/trufflehog:<version>

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 04:43 UTC: the whole history.
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A push to main is never cancelled by the next one: each brings its own range.
concurrency:
  group: secret-scanning-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The two jobs carry this step word for word (a test compares them): the two passes scan the same range.
      - name: Range to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base='' ;;
          esac
          # A push that creates the branch has no "before".
          if [ "$base" = 0000000000000000000000000000000000000000 ]; then base=''; fi
          if [ -n "$base" ] && ! [[ "$base" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error title=Secret scan::The event gives a base that is not a commit: nothing can be scanned from it."
            exit 1
          fi
          # After a forced push, the commit main was at is in no history any more: scanning "since" it would fail with no secret found.
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice title=Secret scan::The commit before this push (${base:0:12}) is not in the history any more (a forced push): the whole history is scanned."
            base=''
          fi
          if [ -n "$base" ]; then echo "Scanning since $base"; else echo "Scanning the whole history"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: HEAD
          # The action runs `<image>:<version>`: the release it is pinned to, and the digest of that image.
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          extra_args: --only-verified

      - name: Report findings
        if: failure()
        run: |
          echo "🚨 Secrets detected! Check TruffleHog output above."
          exit 1

  unverified:
    name: Report unverified findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The two jobs carry this step word for word (a test compares them): the two passes scan the same range.
      - name: Range to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base='' ;;
          esac
          # A push that creates the branch has no "before".
          if [ "$base" = 0000000000000000000000000000000000000000 ]; then base=''; fi
          if [ -n "$base" ] && ! [[ "$base" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error title=Secret scan::The event gives a base that is not a commit: nothing can be scanned from it."
            exit 1
          fi
          # After a forced push, the commit main was at is in no history any more: scanning "since" it would fail with no secret found.
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice title=Secret scan::The commit before this push (${base:0:12}) is not in the history any more (a forced push): the whole history is scanned."
            base=''
          fi
          if [ -n "$base" ]; then echo "Scanning since $base"; else echo "Scanning the whole history"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # What the action of the first job runs (a Docker image, the repository mounted in /tmp), without `--fail` and `--only-verified`, with the
      # results as JSON. The action keeps its output in the log of the job, which is no file to upload, and always passes `--fail`. The image is
      # the one of the first job: the release of the action (v3.99.8), by its digest.
      - name: TruffleHog, all findings
        env:
          IMAGE: ghcr.io/trufflesecurity/trufflehog:3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          BASE: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          args=(git file:///tmp/ --branch "$(git rev-parse HEAD)" --no-update --json)
          if [ -n "$BASE" ]; then args+=(--since-commit "$BASE"); fi
          # The raw results hold the secrets: they stay in the temporary folder of the runner, outside what is uploaded.
          docker run --rm -v "$PWD:/tmp" -w /tmp "$IMAGE" "${args[@]}" > "$RUNNER_TEMP/trufflehog-raw.json"
          mkdir -p findings
          jq -c 'del(.Raw, .RawV2)' "$RUNNER_TEMP/trufflehog-raw.json" > findings/trufflehog-unverified.json
          COUNT="$(wc -l < findings/trufflehog-unverified.json | tr -d ' ')"
          echo "$COUNT finding(s), verified or not"
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning title=TruffleHog, unverified findings::$COUNT finding(s) in the range scanned, none of them checked against a service. Read the artifact trufflehog-unverified of this run."
          fi

      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trufflehog-unverified
          path: findings/
          if-no-files-found: ignore
          retention-days: 7
