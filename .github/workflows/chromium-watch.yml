name: Chromium watch

# Every day, reads the public release feeds (Electron, Chrome stable, castLabs ECS, the Electron release notes) with scripts/electron-watch.mjs
# and, when a newer Electron than the one of package.json is out, opens ONE issue "Electron X (Chromium Y) disponible" (or updates the open
# one, with scripts/chromium-watch-issue.mjs). Nothing else: no commit, no pull request, no build, no download of Electron. The study is docs/mise-a-jour-chromium.md.
#
# What it needs: nothing secret. The token of the run has `issues: write` for the issue and `contents: read` for the checkout; no repository
# secret is referenced. What leaves: GET requests to releases.electronjs.org, chromiumdash.appspot.com (Google) and api.github.com from a
# GitHub runner, never from a user's machine; nothing of anyone is sent.
#
# A feed that cannot be read makes the run fail (GitHub mails the owner about a failed scheduled run): never a silent "up to date".
#
# Cost: one Linux job of about a minute a day. The two actions below are GitHub's own, pinned to a commit (Dependabot keeps the pins current).

on:
  schedule:
    # 06:17 UTC: Electron publishes during the US day, castLabs during the European one; the morning after catches both.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Read the feeds
        id: watch
        run: |
          set +e
          node scripts/electron-watch.mjs --json > report.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The codes are the EXIT_* constants of src/main/electron-watch.ts (the only place that defines them).
          echo "Exit code $code (0 up to date, 10 patch, 20 major, 30 a feed failed, 2 the installed version cannot be read)"
          # The text of the report, for the log and for the issue (the module is TypeScript Node runs as is; the warning about the module
          # type of a .ts file in a package without "type" is the only thing silenced).
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const { formatReport } = await import('./src/main/electron-watch.ts')
            const out = JSON.parse(readFileSync('report.json', 'utf8'))
            console.log(out.kind === 'report' ? formatReport(out.report) : out.message)
          " | tee report.txt
          if [ "$code" = 30 ] || [ "$code" = 2 ]; then
            echo "::error::$(node -p "JSON.parse(require('fs').readFileSync('report.json','utf8')).message")"
            exit 1
          fi

      - name: Open or update the issue
        if: steps.watch.outputs.code == '10' || steps.watch.outputs.code == '20'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # The version, the title, the body and the rule "one issue only" are in src/main/chromium-watch-issue.ts, tested on a sample of the
        # feeds (src/main/chromium-watch-issue.test.ts). No JavaScript is written in this file: a fragment here is run by no test.
        run: node scripts/chromium-watch-issue.mjs --report=report.json --text=report.txt --repo="$REPO"
