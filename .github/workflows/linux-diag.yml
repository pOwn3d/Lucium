name: Linux diagnosis (temporary)

# TEMPORARY, removed before the pull request is merged: it runs the few end-to-end tests that failed on the first Linux run, alone and with the
# logging of the extension library, to find out why (a service worker of an extension that has no chrome.omnibox). It runs only when this very file changes.
# Nothing is published, signed or given a secret.

on:
  pull_request:
    paths:
      - '.github/workflows/linux-diag.yml'

permissions:
  contents: read

concurrency:
  group: linux-diag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extensions:
    name: Diagnosis (Linux, extensions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: System packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb x11-utils libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0t64 libuuid1 libsecret-1-0 \
            libgbm1 libasound2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libcups2t64 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 fonts-liberation
      - run: node node_modules/electron/install.js
      - name: Build
        run: pnpm build
      - name: Sandbox
        run: bash scripts/linux-ci.sh sandbox-profile "$(node -p "require('electron')")"
      - name: Playwright, the failing tests
        env:
          DEBUG: electron-chrome-extensions*
          ELECTRON_ENABLE_LOGGING: '1'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm exec playwright test tests/e2e/extensions.spec.ts tests/e2e/command-bar.spec.ts tests/e2e/tabs-effects.spec.ts tests/e2e/site-panel.spec.ts --grep 'omnibox-keywords|extension-data-apis|little-modifier|last button of the row|row of the extensions goes'
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-diag-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
