<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./tokens.css" />
    <title>Lucium</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* The drawing layer: over the picture, the part of the window that is shared. */
      .window-share-layer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
      }
      .window-share-gone {
        position: fixed;
        left: 0;
        right: 0;
        top: 50%;
        margin: 0;
        padding: 0 16px;
        text-align: center;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        font: 15px system-ui, -apple-system, sans-serif;
        /* The notice does not take the clicks: the drawing under it stays usable (and the passage mode still reaches the window). */
        pointer-events: none;
      }
      .window-share-gone[hidden] {
        display: none;
      }
      .window-share-text {
        position: fixed;
        min-width: 60px;
        margin: 0;
        padding: 0 2px;
        border: 1px dashed rgba(255, 255, 255, 0.6);
        background: transparent;
        font-family: system-ui, -apple-system, sans-serif;
        outline: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./window-share-view.ts"></script>
  </body>
</html>
